name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify files
        run: |
          echo "=== Checking key files ==="
          ls -la lib/models/
          cat lib/models/database.dart | head -5

      - name: Generate Drift code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Verify generated file
        run: |
          echo "=== Generated files ==="
          ls -la lib/models/
          if [ ! -f "lib/models/database.g.dart" ]; then
            echo "❌ database.g.dart not generated!"
            exit 1
          fi

      - name: Decode keystore (release signing)
        # 仅当配置了 Secrets 才执行；未配置则回退 debug 签名（不会报错）
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
