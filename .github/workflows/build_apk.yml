name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify files
        run: |
          echo "=== Checking key files ==="
          ls -la lib/models/
          cat lib/models/database.dart | head -5

      - name: Generate Drift code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Verify generated file
        run: |
          echo "=== Generated files ==="
          ls -la lib/models/
          if [ ! -f "lib/models/database.g.dart" ]; then
            echo "❌ database.g.dart not generated!"
            exit 1
          fi

      - name: Decode keystore (release signing)
        # 仅当配置了 KEYSTORE_BASE64 才执行；密码/别名已写死在下方，无需其他 Secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          {
            echo "storePassword=ledgerFixedKey2024"
            echo "keyPassword=ledgerFixedKey2024"
            echo "keyAlias=ledgerkey"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - name: Verify keystore (解码后立即校验)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          if command -v keytool >/dev/null 2>&1; then
            if ! keytool -list -keystore android/keystore.jks -storepass "ledgerFixedKey2024" -alias ledgerkey 2>keytool_err.txt; then
              echo "❌ keystore 打不开。keytool 真实报错："
              cat keytool_err.txt
              echo "----"
              echo "若为 'Invalid keystore format' / 'stream does not represent a keystore' → KEYSTORE_BASE64 复制不完整或破损，请重新从下载文件整段复制"
              echo "（密码已写死在 CI 脚本中，不再需要 KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS 这三个 Secret）"
              exit 1
            fi
            echo "✅ keystore 校验通过"
          else
            echo "⚠️ keytool 不在 PATH，跳过校验"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
